<div class="eventi-page">
  <div class="page-header">
    <div class="page-header__title">
      <span class="page-eyebrow">Gestione</span>
      <h1 class="page-title">Eventi</h1>
    </div>
    @if (auth.isAdmin()) {
      <button mat-raised-button color="primary" (click)="openNuovoEvento()">
        <mat-icon>add</mat-icon>
        Nuovo Evento
      </button>
    }
  </div>

  <mat-tab-group animationDuration="200ms"
                 [selectedIndex]="tabAttivo()" (selectedIndexChange)="tabAttivo.set($event)">
    @if (!auth.isAdmin()) {
      <mat-tab label="I Miei">
        <div class="tab-content">
          <app-eventi-miei-list />
        </div>
      </mat-tab>
    }
    <mat-tab [label]="etichetta('Lista', totaleLista())">
      <div class="tab-content">
        <app-eventi-list vista="LISTA" [refresh]="refreshTrigger()"
                         (totaleCambiato)="totaleLista.set($event)"
                         (vaiAlloStorico)="vaiAlloStorico()" />
      </div>
    </mat-tab>
    <mat-tab [label]="etichetta('Storico', totaleStorico())">
      <div class="tab-content">
        <app-eventi-list vista="STORICO" [refresh]="refreshTrigger()"
                         (totaleCambiato)="totaleStorico.set($event)" />
      </div>
    </mat-tab>
    <mat-tab label="Calendario">
      <div class="tab-content">
        <app-eventi-calendario [refresh]="refreshTrigger()" />
      </div>
    </mat-tab>
  </mat-tab-group>
</div>
